openapi: 3.1.0
info:
  title: Inferna Next
  version: 0.2.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/users:
    get:
      tags:
      - users
      summary: List Users
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users Api V1 Users Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - users
      summary: Create User
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/users/{user_id}:
    delete:
      tags:
      - users
      summary: Delete User
      operationId: delete_user_api_v1_users__user_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}/password:
    put:
      tags:
      - users
      summary: Change Password
      operationId: change_password_api_v1_users__user_id__password_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/keys:
    get:
      tags:
      - keys
      summary: List Keys
      operationId: list_keys_api_v1_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiKeyOut'
                type: array
                title: Response List Keys Api V1 Keys Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - keys
      summary: Create Key
      operationId: create_key_api_v1_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeySecretOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/keys/{key_id}/revoke:
    post:
      tags:
      - keys
      summary: Revoke Key
      description: 'Revoke an API key (idempotent).


        POST-with-explicit-verb (not DELETE) is deliberate: revoke is a state

        transition on a still-existing resource, not deletion; repeat calls are

        no-ops.'
      operationId: revoke_key_api_v1_keys__key_id__revoke_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyOut'
        '404':
          description: Key not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/clusters:
    get:
      tags:
      - clusters
      summary: List Clusters
      operationId: list_clusters_api_v1_clusters_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ClusterOut'
                type: array
                title: Response List Clusters Api V1 Clusters Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - clusters
      summary: Create Cluster
      operationId: create_cluster_api_v1_clusters_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/clusters/{cluster_id}:
    delete:
      tags:
      - clusters
      summary: Delete Cluster
      operationId: delete_cluster_api_v1_clusters__cluster_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: cluster_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Cluster Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workers:
    get:
      tags:
      - workers
      summary: List Workers
      operationId: list_workers_api_v1_workers_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: cluster_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Cluster Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerOut'
                title: Response List Workers Api V1 Workers Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workers/{worker_id}:
    delete:
      tags:
      - workers
      summary: Delete Worker
      operationId: delete_worker_api_v1_workers__worker_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Worker Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models:
    get:
      tags:
      - models
      summary: List Models
      operationId: list_models_api_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ModelOut'
                type: array
                title: Response List Models Api V1 Models Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/models/{model_id}:
    get:
      tags:
      - models
      summary: Get Model
      operationId: get_model_api_v1_models__model_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/model-instances:
    get:
      tags:
      - instances
      summary: List Instances
      operationId: list_instances_api_v1_model_instances_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InstanceOut'
                type: array
                title: Response List Instances Api V1 Model Instances Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - instances
      summary: Deploy
      operationId: deploy_api_v1_model_instances_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/model-instances/{instance_id}/stop:
    post:
      tags:
      - instances
      summary: Stop Instance
      operationId: stop_instance_api_v1_model_instances__instance_id__stop_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Instance Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/model-instances/{instance_id}/restart:
    post:
      tags:
      - instances
      summary: Restart Instance
      operationId: restart_instance_api_v1_model_instances__instance_id__restart_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Instance Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/model-instances/{instance_id}:
    delete:
      tags:
      - instances
      summary: Delete Instance
      operationId: delete_instance_api_v1_model_instances__instance_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Instance Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dashboard:
    get:
      tags:
      - dashboard
      summary: Dashboard
      operationId: dashboard_api_v1_dashboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOut'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/compatibility:
    get:
      tags:
      - compatibility
      summary: Compatibility
      operationId: compatibility_api_v1_compatibility_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Compatibility Api V1 Compatibility Get
      security:
      - OAuth2PasswordBearer: []
  /v1/chat/completions:
    post:
      tags:
      - gateway
      summary: Chat Completions
      operationId: chat_completions_v1_chat_completions_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                model:
                  type: string
                messages:
                  items: {}
                  type: array
                stream:
                  type: boolean
              type: object
              required:
              - model
              - messages
        required: true
      responses:
        '200':
          description: Success (SSE stream when stream=true)
          content:
            application/json:
              schema: {}
            text/event-stream:
              schema:
                type: string
                description: SSE stream of JSON chunks
        '400':
          description: "Bad request \u2014 missing or invalid model"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '401':
          description: Missing/invalid/revoked/inactive API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '403':
          description: API key lacks inference scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '404':
          description: Model unknown or no running instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '413':
          description: Request body exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '502':
          description: Upstream unreachable or target not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
      security:
      - HTTPBearer: []
  /v1/embeddings:
    post:
      tags:
      - gateway
      summary: Embeddings
      operationId: embeddings_v1_embeddings_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                model:
                  type: string
                input:
                  type: string
                encoding_format:
                  type: string
              type: object
              required:
              - model
              - input
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {}
        '400':
          description: "Bad request \u2014 missing or invalid model"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '401':
          description: Missing/invalid/revoked/inactive API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '403':
          description: API key lacks inference scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '404':
          description: Model unknown or no running instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '413':
          description: Request body exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '502':
          description: Upstream unreachable or target not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
      security:
      - HTTPBearer: []
  /v1/audio/transcriptions:
    post:
      tags:
      - gateway
      summary: Audio Transcriptions
      operationId: audio_transcriptions_v1_audio_transcriptions_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                model:
                  type: string
                file:
                  type: string
                  format: binary
              type: object
              required:
              - model
              - file
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {}
        '400':
          description: "Bad request \u2014 missing or invalid model"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '401':
          description: Missing/invalid/revoked/inactive API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '403':
          description: API key lacks inference scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '404':
          description: Model unknown or no running instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '413':
          description: Request body exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '502':
          description: Upstream unreachable or target not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
      security:
      - HTTPBearer: []
      parameters:
      - name: model
        in: query
        required: false
        schema:
          type: string
        description: Required for application/octet-stream bodies
  /v1/models:
    get:
      tags:
      - gateway
      summary: List Models
      operationId: list_models_v1_models_get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {}
        '401':
          description: Missing/invalid/revoked/inactive API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '403':
          description: API key lacks inference scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
      security:
      - HTTPBearer: []
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
  /readyz:
    get:
      summary: Readyz
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ApiKeyCreate:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
      type: object
      required:
      - name
      title: ApiKeyCreate
    ApiKeyOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        name:
          type: string
          title: Name
        scopes:
          items:
            type: string
          type: array
          title: Scopes
          default: []
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
      type: object
      required:
      - id
      - user_id
      - name
      - created_at
      - updated_at
      title: ApiKeyOut
    ApiKeySecretOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        name:
          type: string
          title: Name
        scopes:
          items:
            type: string
          type: array
          title: Scopes
          default: []
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        key:
          type: string
          title: Key
      type: object
      required:
      - id
      - user_id
      - name
      - created_at
      - updated_at
      - key
      title: ApiKeySecretOut
    ClusterCreate:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - name
      title: ClusterCreate
    ClusterOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - description
      - created_at
      title: ClusterOut
    DashboardOut:
      properties:
        clusters:
          type: integer
          title: Clusters
        workers_online:
          type: integer
          title: Workers Online
        gpus_total:
          type: integer
          title: Gpus Total
        vram_used_mb:
          type: integer
          title: Vram Used Mb
        vram_total_mb:
          type: integer
          title: Vram Total Mb
        instances_running:
          type: integer
          title: Instances Running
        instances:
          items:
            $ref: '#/components/schemas/InstanceOut'
          type: array
          title: Instances
      type: object
      required:
      - clusters
      - workers_online
      - gpus_total
      - vram_used_mb
      - vram_total_mb
      - instances_running
      - instances
      title: DashboardOut
    DeployRequest:
      properties:
        model_id:
          type: string
          format: uuid
          title: Model Id
        cluster_id:
          type: string
          format: uuid
          title: Cluster Id
        engine:
          type: string
          enum:
          - vllm
          - sglang
          title: Engine
        profile:
          type: string
          enum:
          - latency
          - throughput
          title: Profile
        gpu_selection:
          anyOf:
          - $ref: '#/components/schemas/ManualGpuSelection'
          - type: string
            const: auto
          title: Gpu Selection
          default: auto
      type: object
      required:
      - model_id
      - cluster_id
      - engine
      - profile
      title: DeployRequest
    GPUOut:
      properties:
        id:
          type: integer
          title: Id
        index:
          type: integer
          title: Index
        vendor:
          type: string
          title: Vendor
        name:
          type: string
          title: Name
        vram_mb:
          type: integer
          title: Vram Mb
        used_vram_mb:
          type: integer
          title: Used Vram Mb
        utilization_pct:
          type: integer
          title: Utilization Pct
        uuid:
          anyOf:
          - type: string
          - type: 'null'
          title: Uuid
        driver_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Driver Version
      type: object
      required:
