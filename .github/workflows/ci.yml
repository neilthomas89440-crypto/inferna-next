name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [server, worker, bench]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Sync deps
        working-directory: ${{ matrix.dir }}
        run: uv sync --dev
      - name: Ruff
        working-directory: ${{ matrix.dir }}
        run: uv run ruff check .
      - name: Pyright
        working-directory: ${{ matrix.dir }}
        run: uv run pyright
      - name: Pytest
        working-directory: ${{ matrix.dir }}
        run: uv run pytest

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: inferna, POSTGRES_PASSWORD: inferna, POSTGRES_DB: inferna}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inferna" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
        working-directory: server
      - name: Migration check (empty DB, down/up, previous-release upgrade)
        working-directory: server
        env:
          INFERNA_DATABASE_URL: postgresql+asyncpg://inferna:inferna@localhost:5432/inferna
        run: bash ../scripts/check-migrations.sh
      - name: Concurrent allocation test (PostgreSQL)
        working-directory: server
        env:
          INFERNA_DATABASE_URL: postgresql+asyncpg://inferna:inferna@localhost:5432/inferna
        run: uv run alembic upgrade head && uv run pytest tests/test_scheduler_concurrency.py -v
  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Sync server deps (grpc-tools)
        working-directory: server
        run: uv sync --dev
      - name: Regenerate stubs
        run: bash scripts/gen-proto.sh
      - name: Stubs must be committed
        run: git diff --exit-code

  openapi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Sync server deps
        working-directory: server
        run: uv sync --dev
      - name: Spec must be current
        working-directory: server
        run: uv run python ../scripts/export-openapi.py --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

  usage-reconcile:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Start stack (mock)
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --build postgres server worker
      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 5
          done
          exit 1
      - name: Deploy a model and create a key
        # The gateway needs a live instance and a key; the mock worker has no engine, so the calls
        # below answer 502 - which must still be *counted* (that is what the reconciliation checks).
        # The deploy also needs a *connected* worker, and the worker registers after the server is
        # up, so the script waits for one instead of racing it (a 400 here means "no worker yet").
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, time, urllib.request
          B = "http://localhost:8000/api/v1"
          def call(method, path, body=None, token=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(B + path, method=method, data=data)
              if data: r.add_header("Content-Type", "application/json")
              if token: r.add_header("Authorization", "Bearer " + token)
              with urllib.request.urlopen(r) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else None
          token = call("POST", "/auth/login", {"username": "admin", "password": "inferna"})["access_token"]
          for _ in range(30):
              workers = call("GET", "/workers", token=token)
              rows = workers if isinstance(workers, list) else workers.get("items", [])
              if any(row.get("state") == "connected" for row in rows):
                  break
              time.sleep(5)
          else:
              raise SystemExit("no worker connected within 150 s")
          model = call("GET", "/models", token=token)[0]
          key = call("POST", "/keys", {"name": "ci-usage"}, token=token)["key"]
          clusters = call("GET", "/clusters", token=token)
          cluster = (clusters if isinstance(clusters, list) else clusters["items"])[0]
          created = call("POST", "/model-instances", {"model_id": model["id"],
                                                      "cluster_id": cluster["id"], "engine": "vllm",
                                                      "profile": "latency", "replicas": 1,
                                                      "gpu_selection": "auto"}, token=token)
          if not created:
              raise SystemExit("deploy did not return an instance")
          time.sleep(25)  # let the worker sync the instance to running
          print(f"INFERNA_JWT={token}")
          print(f"INFERNA_MODEL={model['name']}")
          print(f"INFERNA_KEY={key}")
          PY
      - name: Reconcile usage against /metrics
        # M8 gate: usage aggregates must match the gateway counters within the tolerance.
        run: |
          python3 scripts/usage-reconcile.py --api http://localhost:8000 --token "$INFERNA_JWT" \
            --days 1 --window 30 \
            --traffic-cmd "bash scripts/bench.sh --api http://localhost:8000 --api-key $INFERNA_KEY \
              --model $INFERNA_MODEL --scenario ttft-only --repeats 6 --warmup 1 --allow-errors \
              --environment mock"

  coding-validation-mock:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install the harness
        working-directory: bench
        run: uv sync --dev
      - name: Coding validation harness check
        # The fixture and the runner share one step so the background server lives for the whole
        # check. It exercises the CLI, the checks, the JSONL and the render path — the answers of
        # a fixture are not asserted (that is what --smoke means).
        run: |
          ( cd bench && uv run python -m bench.fake_upstream --port 9200 --chunks 6 --delay 0.005 --no-auth ) &
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/9200) 2>/dev/null; then break; fi
            sleep 1
          done
          bash scripts/coding-validation.sh --api http://127.0.0.1:9200 --api-key ci \
            --model fake-model --environment fake-upstream --smoke --out artifacts/coding-ci.jsonl

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Start stack (mock, backend only)
        run: docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --build postgres server worker
      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 5
          done
          exit 1
      - name: Build frontend (API base override)
        working-directory: frontend
        env:
          VITE_API_BASE: http://localhost:8000/api/v1
        run: npm run build
      - name: E2E
        working-directory: frontend
        run: npx playwright test
