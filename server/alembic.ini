# Alembic configuration for inferna-server.
# The database URL is read from INFERNA_DATABASE_URL in alembic/env.py,
# not hardcoded here.

[alembic]
script_location = alembic
prepend_sys_path = .
# Path to migration scripts; autogenerated revisions land in alembic/versions.
file_template = %%(rev)s_%%(slug)s
# Use a synchronous driver for migration operations regardless of the
# application's async URL scheme.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
