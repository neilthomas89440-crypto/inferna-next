[project]
name = "inferna-server"
version = "0.2.0"
description = "Inferna Next control plane: FastAPI + gRPC GPU cluster orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "grpcio",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "aiosqlite",
    "pydantic",
    "pydantic-settings",
    "PyJWT",
    "bcrypt",
    "structlog",
    "prometheus-client",
    "python-multipart",
    "prometheus-fastapi-instrumentator",
    "PyYAML",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "pyright",
    "grpcio-tools",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["inferna_server/proto", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
exclude = ["**/proto", "**/.venv"]
