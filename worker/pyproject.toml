[project]
name = "inferna-worker"
version = "0.2.0"
description = "Inferna Next GPU worker agent"
requires-python = ">=3.12"
dependencies = [
    "grpcio",
    "pydantic-settings",
    "structlog",
    "docker",
    "psutil",
    "nvidia-ml-py",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
    "grpcio-tools",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["inferna_worker/proto"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
exclude = ["**/proto", "**/.venv"]
