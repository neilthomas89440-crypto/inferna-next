syntax = "proto3";

package inferna.v1;

service WorkerService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Sync(SyncRequest) returns (SyncResponse);
}

message RegisterRequest {
  string cluster_token = 1;   // INFERNA_REGISTRATION_TOKEN
  string hostname = 2;
  string worker_name = 3;     // optional; empty = use hostname
  string cluster_name = 4;    // optional; empty = "default"
  string version = 5;
  int32 protocol_version = 6;
}

message RegisterResponse {
  string worker_id = 1;       // uuid4 hex
  string worker_token = 2;    // random 32 hex chars; worker sends it in every Sync
  int32 sync_interval_seconds = 3;  // always 5
}

message GPUInfo {
  int32 index = 1;
  string vendor = 2;          // "nvidia" | "amd" | "mock"
  string name = 3;
  uint64 vram_mb = 4;
  uint64 used_vram_mb = 5;    // nvml used memory; mock synthesizes
  int32 utilization_pct = 6;  // 0-100; mock synthesizes
  string uuid = 7;
  string driver_version = 8;
}

message SystemInfo {
  uint32 cpu_cores = 1;
  uint64 memory_mb = 2;
  string os = 3;
  string hostname = 4;
}
message InstanceStatus {
  string instance_id = 1;
  string state = 2;           // "scheduled" | "starting" | "running" | "stopped" | "error"
  string detail = 3;          // error text / progress note
  int32 port = 4;             // host port once running
  int64 generation = 5;
}

message EngineConfig {
  string engine = 1;          // "vllm" | "sglang"
  string model_name = 2;      // huggingface id
  string profile = 3;         // "latency" | "throughput"
  repeated int32 gpu_indexes = 4;
  uint64 vram_required_mb = 5;
  int32 port = 6;             // host port allocated by server
  bool requires_hf_token = 7; // worker must have INFERNA_HF_TOKEN set
}
message InstanceCommand {
  string instance_id = 1;
  string action = 2;          // "start" | "stop" | "delete"
  EngineConfig config = 3;    // set when action == "start"
  int64 generation = 4;
}

message SyncRequest {
  string worker_id = 1;
  string worker_token = 2;
  SystemInfo system = 3;
  repeated GPUInfo gpus = 4;
  repeated InstanceStatus instances = 5;
}

message SyncResponse {
  repeated InstanceCommand commands = 1;
}
