server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    location /api/v1/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        proxy_pass http://server:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        # /v1/ prefix matches /v1/models, /v1/chat/completions, etc. (first 4
        # chars "/v1/"). There is no bare /v1 route, so this block is the
        # correct proxy target for all gateway inference endpoints.
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri /index.html;
    }
}
